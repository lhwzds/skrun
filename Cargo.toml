[workspace]
members = ["crates/skrun", "crates/py"]
default-members = ["crates/skrun"]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.2.0"
license = "MIT"
repository = "https://github.com/lhwzds/skrun"
homepage = "https://skrun.ai"
description = "skrun executable skill runtime internals."

[workspace.dependencies]
skrun = { path = "crates/skrun" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
